<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Primary SEO -->
    <title>
      Wavexa Technologies | IT & Healthcare Solutions | Global Healthcare Conferences
    </title>

    <meta
      name="description"
      content="Wavexa Technologies delivers innovative IT and healthcare solutions and organizes global healthcare conferences connecting researchers, clinicians, healthcare professionals and industry experts."
    />

    <meta
      name="keywords"
      content="Wavexa Technologies, Wavexa, IT solutions, healthcare solutions, healthcare technology, healthcare conferences, medical conferences, international conferences, medical research, healthcare innovation, digital healthcare, healthcare professionals"
    />

    <meta
      name="author"
      content="Wavexa Technologies"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#07111F"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://wavexaglobal.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/favicon.ico"
      type="image/x-icon"
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Wavexa Technologies"
    />

    <meta
      property="og:title"
      content="Wavexa Technologies | IT & Healthcare Solutions"
    />

    <meta
      property="og:description"
      content="Innovative IT and healthcare solutions, global healthcare conferences, research collaboration and future-focused healthcare innovation."
    />

    <meta
      property="og:url"
      content="https://wavexaglobal.com/"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Wavexa Technologies | IT & Healthcare Solutions"
    />

    <meta
      name="twitter:description"
      content="Innovative IT and healthcare solutions, global healthcare conferences and healthcare innovation."
    />

    <meta
      name="twitter:site"
      content="@WavexaTechnologies"
    />

    <!-- Search Engine / Organization Information -->
    <meta
      name="application-name"
      content="Wavexa Technologies"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Wavexa Technologies"
    />

    <!-- Performance: Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
